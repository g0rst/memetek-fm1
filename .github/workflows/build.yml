name: build
# Every push to main builds the module and the solo firmware (download them from the run's "packages" artifact);
# a tag v* also makes a GitHub release with them.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - name: Host tests (the module on a fake FM-1, with sanitizers)
        run: |
          python3 -m pip install Pillow
          python3 tools/handbuch.py --check
          tests/run_host.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        if: always()
        with:
          name: host-test
          path: build/host/*
  build:
    needs: test
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: ./build.sh ${{ github.ref_type == 'tag' && format('--release {0}', github.ref_name) || '' }}
      packages: build/g0dsgift*
  release:
    # a push to main publishes its packages as the release vX.Y of the VERSION file (updated in place until VERSION changes)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - id: v
        run: echo "v=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8   # v2.3.2
        with:
          tag_name: v${{ steps.v.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: g0dsgift v${{ steps.v.outputs.v }}
          prerelease: true
          overwrite_files: true
          files: |
            dist/build/g0dsgift*
            dist/SHA256SUMS
          body: |
            g0dsgift v${{ steps.v.outputs.v }}, die Groovebox für 8-Bit-Memetek (build ${{ github.sha }}). Noch nicht auf echter Hardware getestet: Installieren auf eigene Gefahr.

            **g0dsgift.dock**: das Modul für fm1-dock. fm1-dock einmal installieren (https://joakimeriksson.github.io/fm1-dock/#install), dann die Datei auf die Konsole ziehen (https://joakimeriksson.github.io/fm1-dock/#console). Am FM-1 HOME halten und G0DSGIFT wählen.
            **g0dsgift.fwsc**: dieselbe Firmware eigenständig (fm1-dock mit G0DSGIFT allein, Identität FM-1_964).
            Zurück: FM-1 Firmware Hub (https://fm1.designburgapps.com) oder M-VAVEs Updater.
  pages:
    # the site: the packages, the browser prototype and a link that opens the firmware in fm1-emu
    # (needs Settings > Pages > Source: GitHub Actions, once)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - run: |
          mkdir -p _site
          python3 -m pip install markdown
          python3 tools/handbuch.py --html _site
          cp site/index.html _site/
          cp web/index.html _site/prototype.html
          cp dist/build/g0dsgift* dist/SHA256SUMS _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
